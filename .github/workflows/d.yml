name: Windows 编译、测试与发布

on:
  push:
    branches: ['main']
    tags: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: 编译与测试
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: 检出触发事件对应的代码
        uses: actions/checkout@v7

      - name: 安装 LDC 工具链
        uses: dlang-community/setup-dlang@4c99aa991ce7d19dd3064de0a4f2f6b2f152e2d7
        with:
          compiler: ldc-latest

      - name: 编译发布版本
        run: dub build --config=application --build=release --compiler="$env:DC" --arch=x86_64

      - name: 执行全部单元与进程测试
        run: dub test --compiler="$env:DC" --arch=x86_64

      - name: 整理发布文件
        run: >-
          node -e "const fs = require('node:fs'); fs.mkdirSync('dist', { recursive: true });
          for (const [source, name] of [['.dub/dservice.exe', 'dservice.exe'], ['dservice.ini.example', 'dservice.ini.example'], ['README.md', 'README.md']])
          fs.copyFileSync(source, 'dist/' + name);"

      - name: 上传 Windows x64 构建产物
        uses: actions/upload-artifact@v4
        with:
          name: dservice-windows-x64
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: 保留测试日志（包括失败时）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dservice-test-logs
          path: .dub/*.log
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14

  release:
    name: 发布 release 前缀标签
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/release')
    runs-on: windows-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: 下载本次标签编译并测试通过的产物
        uses: actions/download-artifact@v4
        with:
          name: dservice-windows-x64
          path: dist

      - name: 创建 GitHub Release 并上传文件
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          gh release create "$env:RELEASE_TAG" --verify-tag --generate-notes
          --title "$env:RELEASE_TAG"
          dist/dservice.exe dist/dservice.ini.example dist/README.md
